name: Supabase Database Backup

on:
  schedule:
    # Запуск каждый день в 03:00 ночи (по UTC)
    - cron: '0 3 * * *'
  # Разрешает запускать бэкап вручную кнопкой в интерфейсе GitHub
  workflow_dispatch: 

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Create Backup (pg_dump)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --clean > chordschart_backup_$(date +'%Y-%m-%d').sql

      - name: Save Backup as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: chordschart_backup_*.sql
          retention-days: 90
